openapi: 3.0.3
info:
  title: LLM Gateway - Control Plane (Management API)
  description: |
    Centralized administrative and management plane for LLM Gateway.
    Handles Multi-Tenant B2B partitioning, IAM roles and policies, API keys,
    Dynamic Virtual Model routing, Pluggable middleware pipelines, Usage analytics,
    Audit trails, and Incident alerting.
  version: 0.4.0
  contact:
    name: LLM Gateway Admin Team
    url: https://github.com/tcc3281/llm-gateway

servers:
  - url: http://localhost:8081
    description: Local Control Plane Admin Server
  - url: https://gateway-admin.internal.company.com:8081
    description: Production Control Plane Server

tags:
  - name: Authentication & Profile
    description: Admin authentication, session tokens, and profile management.
  - name: Tenants & B2B Billing
    description: Multi-tenant organizational partitions, prepaid credit balances, and contract deposits.
  - name: Users & API Keys
    description: User lifecycle, API keys, RPM limits, budget quotas, and model allow/deny rules.
  - name: Groups & IAM Policies
    description: RBAC/IAM teams, AWS-style JSON permission documents, and member roles.
  - name: Providers & Models
    description: Upstream provider API credentials, pricing matrices, and auto-discovered catalogs.
  - name: Virtual Models & Routing
    description: Dynamic model aliases, fallback priority chains, and canary weight distribution.
  - name: Plugins & Bindings
    description: Extensible guardrail engine, first-party plugin catalog, and multi-level scope bindings.
  - name: Observability & Analytics
    description: Aggregate usage stats, member spend reports, zero-knowledge structural telemetry, and audit logs.
  - name: Alerts & Webhooks
    description: Automated incident threshold rules, webhook dispatches (Slack, Discord, PagerDuty), and execution history.
  - name: System & Health
    description: Control Plane health, runtime diagnostics, and Prometheus scraping.

paths:
  # ==========================================
  # Authentication & Profile
  # ==========================================
  /admin/auth/login:
    post:
      tags:
        - Authentication & Profile
      summary: Admin Session Login
      description: Authenticates with email and password to receive a bearer session token.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@company.com
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT or session token.
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid email or password.

  /admin/auth/me:
    get:
      tags:
        - Authentication & Profile
      summary: Get Current User Profile
      description: Returns identity and role information for the active authenticated session.
      operationId: getCurrentUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
        - SessionTokenAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized.

  /admin/auth/password:
    post:
      tags:
        - Authentication & Profile
      summary: Change User Password
      description: Updates password for the authenticated administrator.
      operationId: changePassword
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
        - SessionTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password successfully changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully

  # ==========================================
  # Tenants & B2B Billing (Partitioning)
  # ==========================================
  /admin/tenants:
    get:
      tags:
        - Tenants & B2B Billing
      summary: List Tenants
      description: Returns all organizational partitions with credit balances and billing modes.
      operationId: listTenants
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: Array of tenants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'

    post:
      tags:
        - Tenants & B2B Billing
      summary: Create Tenant Partition
      description: Provisions a new isolated tenant partition with prepaid or postpaid billing.
      operationId: createTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Engineering Department
                type:
                  type: string
                  enum: [internal, external]
                  default: external
                billing_mode:
                  type: string
                  enum: [prepaid, postpaid]
                  default: prepaid
                budget_limit_monthly:
                  type: number
                  format: float
                  example: 500.0
                allowed_models:
                  type: array
                  items:
                    type: string
                  example: ["gpt-4o-mini", "claude-3-5-haiku"]
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Tenant created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /admin/tenants/{id}:
    get:
      tags:
        - Tenants & B2B Billing
      summary: Get Tenant Details
      description: Retrieves details of a specific tenant partition.
      operationId: getTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Tenant not found.

    patch:
      tags:
        - Tenants & B2B Billing
      summary: Update Tenant
      description: Modifies configuration, monthly budget, or model access for a tenant.
      operationId: updateTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPatch'
      responses:
        '200':
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

    delete:
      tags:
        - Tenants & B2B Billing
      summary: Delete Tenant Partition
      description: Deletes an organizational tenant partition and its constraints.
      operationId: deleteTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted

  /admin/tenants/{id}/topup:
    post:
      tags:
        - Tenants & B2B Billing
      summary: Top Up Tenant Credit
      description: Deposits prepaid funds into a tenant balance with contract reference tracking.
      operationId: topUpTenantCredit
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpCreditRequest'
      responses:
        '200':
          description: Credit balance updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreditTransaction'

  /admin/tenants/{id}/transactions:
    get:
      tags:
        - Tenants & B2B Billing
      summary: List Tenant Billing Transactions
      description: Paginated transaction ledger for deposits, adjustments, and usage deductions.
      operationId: listTenantTransactions
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Transaction history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantCreditTransaction'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  # ==========================================
  # Users & API Keys
  # ==========================================
  /admin/users:
    get:
      tags:
        - Users & API Keys
      summary: List Users
      description: Lists users optionally filtered by tenant or search keywords.
      operationId: listUsers
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      tags:
        - Users & API Keys
      summary: Create User
      description: Registers a new user and assigns them to an optional tenant.
      operationId: createUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: dev@company.com
                name:
                  type: string
                  example: Alex Doe
                role:
                  type: string
                  enum: [admin, user]
                  default: user
                password:
                  type: string
                  format: password
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      tags:
        - Users & API Keys
      summary: Update User
      description: Modifies user status, role, password, or tenant assignment.
      operationId: updateUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
                is_active:
                  type: boolean
                password:
                  type: string
                  format: password
                tenant_id:
                  type: string
                  format: uuid
                tenant_role:
                  type: string
                  enum: [tenant_admin, member, viewer]
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags:
        - Users & API Keys
      summary: Delete User
      description: Removes a user from the gateway.
      operationId: deleteUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted

  /admin/keys:
    get:
      tags:
        - Users & API Keys
      summary: List API Keys
      description: Returns active and revoked API keys for a user or tenant.
      operationId: listAPIKeys
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'

    post:
      tags:
        - Users & API Keys
      summary: Create API Key
      description: Generates a new `sk-gw-...` key with rate limits, budget ceilings, and cache TTL.
      operationId: createAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - name
              properties:
                user_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: backend-prod-key
                budget_limit:
                  type: number
                  format: float
                  example: 50.0
                rate_limit_rpm:
                  type: integer
                  example: 120
                cache_ttl_seconds:
                  type: integer
                  default: 0
                budget_period:
                  type: string
                  enum: [daily, weekly, monthly]
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Key successfully provisioned. Plain text key returned only once!
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    $ref: '#/components/schemas/APIKey'
                  key:
                    type: string
                    description: Plaintext API secret (`sk-gw-...`).
                    example: sk-gw-8f7a9bc12de34f5...

    patch:
      tags:
        - Users & API Keys
      summary: Update API Key
      description: Modifies limits, expiration, or active status of an API key.
      operationId: updateAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                budget_limit:
                  type: number
                rate_limit_rpm:
                  type: integer
                cache_ttl_seconds:
                  type: integer
                budget_period:
                  type: string
                is_active:
                  type: boolean
                expires_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: API key updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'

    delete:
      tags:
        - Users & API Keys
      summary: Revoke API Key
      description: Soft revokes an API key immediately.
      operationId: revokeAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API key revoked

  /admin/keys/reactivate:
    post:
      tags:
        - Users & API Keys
      summary: Reactivate API Key
      description: Restores a previously revoked API key to active status.
      operationId: reactivateAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Key reactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API key reactivated

  /admin/keys/{id}/models:
    get:
      tags:
        - Users & API Keys
      summary: List Key Model Policies
      description: Lists model allowlist or denylist pattern rules attached to this key.
      operationId: listKeyModelPolicies
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of model policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyModelPolicy'

    post:
      tags:
        - Users & API Keys
      summary: Add Key Model Policy Rule
      description: Adds a wildcard pattern rule (e.g. `gpt-4*`, `claude-*`) allowing or denying access.
      operationId: createKeyModelPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model_pattern
                - action
              properties:
                model_pattern:
                  type: string
                  example: gpt-4*
                action:
                  type: string
                  enum: [allow, deny]
      responses:
        '201':
          description: Policy rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyModelPolicy'

  /admin/keys/{id}/models/{pid}:
    delete:
      tags:
        - Users & API Keys
      summary: Delete Key Model Policy Rule
      description: Removes a specific model access rule from an API key.
      operationId: deleteKeyModelPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Policy rule deleted

  # ==========================================
  # Groups & IAM Policies
  # ==========================================
  /admin/groups:
    get:
      tags:
        - Groups & IAM Policies
      summary: List IAM Groups
      description: Returns teams and groups with member and policy counts.
      operationId: listGroups
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: Array of groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'

    post:
      tags:
        - Groups & IAM Policies
      summary: Create IAM Group
      description: Provisions a team group for pooled budgets and unified IAM policies.
      operationId: createGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Data Science Team
                description:
                  type: string
                  example: Core ML & Analytics Team
                budget_limit_monthly:
                  type: number
                  format: float
                  example: 1000.0
                rate_limit_rpm:
                  type: integer
                  example: 300
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /admin/groups/{id}:
    get:
      tags:
        - Groups & IAM Policies
      summary: Get Group Details
      description: Retrieves a specific group by ID.
      operationId: getGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

    patch:
      tags:
        - Groups & IAM Policies
      summary: Update Group
      description: Updates group name, description, budget, or RPM limits.
      operationId: updateGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                budget_limit_monthly:
                  type: number
                rate_limit_rpm:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Group updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

    delete:
      tags:
        - Groups & IAM Policies
      summary: Delete Group
      description: Deletes an IAM group.
      operationId: deleteGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Group deleted successfully

  /admin/groups/{id}/policies:
    get:
      tags:
        - Groups & IAM Policies
      summary: List Group Policies
      description: Lists AWS IAM-style JSON documents attached to the group.
      operationId: listGroupPolicies
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Attached IAM policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupPolicy'

    post:
      tags:
        - Groups & IAM Policies
      summary: Attach IAM Policy to Group
      description: Evaluates and attaches an AWS IAM JSON policy statement.
      operationId: createGroupPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - policy
              properties:
                name:
                  type: string
                  example: AllowChatAndEmbedding
                policy:
                  type: object
                  description: "AWS IAM statement syntax ({ 'Version': '2012-10-17', 'Statement': [...] })."
                priority:
                  type: integer
                  default: 10
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Policy attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPolicy'

  /admin/groups/{id}/policies/{pid}:
    patch:
      tags:
        - Groups & IAM Policies
      summary: Update IAM Policy
      description: Updates policy JSON document, priority, or activation status.
      operationId: updateGroupPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                policy:
                  type: object
                priority:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPolicy'

    delete:
      tags:
        - Groups & IAM Policies
      summary: Detach IAM Policy
      description: Removes an IAM policy from a group.
      operationId: deleteGroupPolicy
      security:
