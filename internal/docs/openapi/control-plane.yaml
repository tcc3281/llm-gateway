      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: key_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Dashboard statistics payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    $ref: '#/components/schemas/UsageTotal'
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageSeriesPoint'
                  by_model:
                    type: array
                    items:
