  # ==========================================
  # Providers & Models
  # ==========================================
  /admin/providers:
    get:
      tags:
        - Providers & Models
      summary: List Provider Master Keys
      description: Returns configured upstream providers (secrets masked).
      operationId: listProviders
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: Array of provider keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderKey'

    post:
      tags:
        - Providers & Models
      summary: Upsert Provider Master Key
      description: Registers or updates upstream API credentials for OpenAI, Anthropic, Gemini, or custom OpenAI-compatible endpoints.
      operationId: setProviderKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - api_key
              properties:
                provider:
                  type: string
                  example: openai
                api_key:
                  type: string
                  format: password
                  example: sk-proj-...
                base_url:
                  type: string
                  example: https://api.openai.com/v1
                protocol:
                  type: string
                  enum: [openai, anthropic]
                fallback_priority:
                  type: integer
                is_active:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Provider credentials updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderKey'

    delete:
      tags:
        - Providers & Models
      summary: Delete Provider Master Key
      description: Removes upstream credentials for a provider.
      operationId: deleteProviderKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Provider key deleted

  /admin/models:
    get:
      tags:
        - Providers & Models
      summary: Get Pricing & Model Configurations
      description: Returns active pricing rates per 1M tokens.
      operationId: getModels
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Array of model pricing rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelPricing'

    post:
      tags:
        - Providers & Models
      summary: Upsert Model Pricing
      description: Sets prompt and completion rates per 1M tokens.
      operationId: upsertModelPricing
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - model_name
                - prompt_price_per_1m
                - completion_price_per_1m
              properties:
                provider:
                  type: string
                  example: openai
                model_name:
                  type: string
                  example: gpt-4o-mini
                prompt_price_per_1m:
                  type: number
                  format: float
                  example: 0.15
                completion_price_per_1m:
                  type: number
                  format: float
                  example: 0.60
                cache_read_price_per_1m:
                  type: number
                  format: float
                  example: 0.075
      responses:
        '200':
          description: Pricing saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPricing'

    delete:
      tags:
        - Providers & Models
      summary: Delete Model Pricing
      description: Removes pricing entry by ID.
      operationId: deleteModelPricing
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pricing deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Model pricing deleted

  /admin/models/catalog:
