            format: uuid
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
