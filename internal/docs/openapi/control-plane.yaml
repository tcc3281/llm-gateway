            application/json:
              schema:
                $ref: '#/components/schemas/VirtualModel'

  /admin/virtual-models/{id}:
    get:
      tags:
        - Virtual Models & Routing
      summary: Get Virtual Model
      description: Retrieves a virtual model definition by ID.
      operationId: getVirtualModel
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
