              provider:
                type: string
                example: openai
              model_name:
                type: string
                example: gpt-4o-mini
              weight:
                type: integer
                default: 100
              priority:
                type: integer
                default: 1
              is_active:
                type: boolean
                default: true

    UpdateVirtualModelRequest:
      type: object
