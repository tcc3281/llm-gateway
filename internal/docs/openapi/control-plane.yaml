        description:
          type: string
        tenant_id:
          type: string
          format: uuid
        routing_strategy:
          type: string
          enum: [weighted, fallback, round_robin]
          default: weighted
        is_active:
          type: boolean
          default: true
        allow_override:
          type: boolean
          default: false
        targets:
          type: array
          items:
            type: object
            required:
              - provider
              - model_name
