        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: Array of alert rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'

    post:
      tags:
        - Alerts & Webhooks
      summary: Create Alert Rule
      description: Defines an automated anomaly rule with multi-channel webhook routing.
      operationId: createAlertRule
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
      responses:
        '201':
          description: Rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'

  /admin/alerts/rules/{id}:
    patch:
      tags:
        - Alerts & Webhooks
      summary: Update Alert Rule
      description: Modifies thresholds, destination webhooks, or cooldown timers.
      operationId: updateAlertRule
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRulePatch'
      responses:
        '200':
          description: Rule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'

    delete:
      tags:
        - Alerts & Webhooks
      summary: Delete Alert Rule
      description: Deletes an alert rule.
      operationId: deleteAlertRule
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Alert rule deleted

  /admin/alerts/history:
    get:
      tags:
        - Alerts & Webhooks
      summary: List Alert Dispatch History
      description: Paginated log of sent and suppressed webhook incident dispatches.
      operationId: listAlertHistory
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Alert dispatch history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertHistory'

  /admin/alerts/test:
    post:
      tags:
        - Alerts & Webhooks
      summary: Send Test Alert Webhook
      description: Dispatches a simulated test payload to verify destination webhook connectivity.
      operationId: testAlertWebhook
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestWebhookRequest'
      responses:
        '200':
          description: Webhook delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: delivered
                  status_code:
                    type: integer
                    example: 200

  # ==========================================
  # System & Health
  # ==========================================
  /admin/system/info:
    get:
      tags:
        - System & Health
      summary: System Runtime Diagnostics
      description: Returns Go runtime memory metrics, goroutines count, uptime, and database connection pool statuses.
      operationId: getSystemInfo
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: System runtime diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: v0.4.0
                  uptime_seconds:
                    type: integer
                    example: 86400
                  goroutines:
                    type: integer
                    example: 42
                  postgres_connected:
                    type: boolean
                    example: true
                  redis_connected:
                    type: boolean
                    example: true

  /health:
    get:
      tags:
        - System & Health
      summary: Control Plane Health Check
      description: Returns status of Control Plane service.
      operationId: getControlPlaneHealth
      responses:
        '200':
          description: Health check OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: llm-gateway-control-plane

  /metrics:
    get:
      tags:
        - System & Health
      summary: Prometheus Metrics
      description: Exposes Prometheus operational telemetry for the control plane.
      operationId: getControlPlaneMetrics
      responses:
        '200':
          description: Prometheus metrics exposition.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: Root Break-Glass Administration API Key.
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin session token from `/admin/auth/login`.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Alternative header for session token.

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
        is_root:
          type: boolean
        is_active:
          type: boolean
        group_role:
          type: string
          nullable: true
        tenant_id:
          type: string
          format: uuid
          nullable: true
        tenant_role:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    APIKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
        key_prefix:
          type: string
          example: sk-gw-8f7a9...
        name:
          type: string
        budget_limit:
          type: number
          format: float
        rate_limit_rpm:
          type: integer
        cache_ttl_seconds:
          type: integer
        budget_period:
          type: string
          nullable: true
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    KeyModelPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key_id:
          type: string
          format: uuid
        model_pattern:
          type: string
          example: gpt-4*
        is_allowlist:
          type: boolean
        created_at:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme Corp
        type:
          type: string
          enum: [internal, external]
        billing_mode:
          type: string
          enum: [prepaid, postpaid]
        credit_balance:
          type: number
          format: float
        budget_limit_monthly:
          type: number
          format: float
        allowed_models:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantPatch:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [internal, external]
        billing_mode:
          type: string
          enum: [prepaid, postpaid]
        budget_limit_monthly:
          type: number
          format: float
        allowed_models:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    TenantCreditTransaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        balance_after:
          type: number
          format: float
        type:
          type: string
          enum: [contract_deposit, admin_adjustment, usage_deduction, refund]
        contract_ref:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    TopUpCreditRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          example: 100.0
        contract_ref:
          type: string
          example: WIRE-TX-20260901
        notes:
          type: string
          example: Q3 Development Budget

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        budget_limit_monthly:
          type: number
          format: float
        rate_limit_rpm:
          type: integer
        is_active:
          type: boolean
        member_count:
          type: integer
        policy_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        name:
          type: string
        policy:
          type: object
        priority:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    ProviderKey:
      type: object
