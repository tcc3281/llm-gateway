openapi: 3.0.3
info:
  title: LLM Gateway API (Unified Architectural Specification)
  description: |
    Unified OpenAPI 3.0 specification for the LLM Gateway, partitioned into:
    - **Data Plane (Inference Proxy)** on Port 8080: OpenAI/Anthropic chat, messages, embeddings, models, streaming SSE.
    - **Control Plane (Management Engine)** on Port 8081: Multi-tenant partitioning, IAM, API keys, Virtual models, Plugins, Analytics, and Alerts.

    For modular partition specifications, see:
    - [Data Plane OpenAPI](file://docs/openapi/data-plane.yaml)
    - [Control Plane OpenAPI](file://docs/openapi/control-plane.yaml)
  version: 0.4.0
  contact:
    name: LLM Gateway Core Team
    url: https://github.com/tcc3281/llm-gateway

servers:
  - url: http://localhost:8080
    description: Data Plane / Proxy Engine (Inference Traffic)
  - url: http://localhost:8081
    description: Control Plane / Management Core (Administrative Traffic)

tags:
  - name: Data Plane - Chat & Messages
    description: High-throughput OpenAI and Anthropic compatible inference proxy.
  - name: Data Plane - Embeddings
    description: Text embedding generation.
  - name: Data Plane - Models
    description: Public model and virtual alias catalog.
  - name: Control Plane - Auth & Profile
    description: Administrative authentication and credentials.
  - name: Control Plane - Tenants & Billing
    description: Multi-tenant organizational partitioning, balances, and billing.
  - name: Control Plane - Users & API Keys
    description: Identity management, rate limits, budgets, and key model policies.
  - name: Control Plane - Groups & IAM
    description: RBAC/IAM teams, AWS-style JSON permission policies, and role assignment.
  - name: Control Plane - Providers & Models
    description: Upstream credentials and pricing catalogs.
  - name: Control Plane - Virtual Models
    description: Dynamic virtual model routing and traffic split weights.
  - name: Control Plane - Plugins & Guardrails
    description: Multi-scope pluggable middleware pipeline (Prompt Guard, PII Masking, etc.).
  - name: Control Plane - Observability
    description: Dashboard telemetry, member analytics, zero-knowledge traces, and audit logs.
  - name: Control Plane - Alerts
    description: Real-time incident rules and multi-channel webhook notifications.
  - name: System & Diagnostics
    description: Health probes and Prometheus metrics across planes.

paths:
  # ============================================================================
  # DATA PLANE ENDPOINTS (:8080)
  # ============================================================================
  /v1/chat/completions:
    servers:
      - url: http://localhost:8080
        description: Data Plane Proxy
    post:
      tags:
        - Data Plane - Chat & Messages
      summary: OpenAI Compatible Chat Completions
      description: Routes chat requests to OpenAI, Gemini, or custom backends with fallbacks and streaming SSE.
      operationId: dataPlaneChatCompletions
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: x-upstream-api-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatCompletionRequest'
      responses:
        '200':
          description: Chat completion response or SSE stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '402':
          description: Insufficient tenant or key balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  /v1/messages:
    servers:
      - url: http://localhost:8080
        description: Data Plane Proxy
    post:
      tags:
        - Data Plane - Chat & Messages
      summary: Anthropic Compatible Messages
      description: Routes Anthropic Claude format message requests.
      operationId: dataPlaneAnthropicMessages
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
            default: '2023-06-01'
        - name: x-upstream-api-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Anthropic message response or SSE stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicErrorResponse'

  /v1/embeddings:
    servers:
      - url: http://localhost:8080
        description: Data Plane Proxy
    post:
      tags:
        - Data Plane - Embeddings
      summary: OpenAI Compatible Embeddings
      description: Generates embedding vectors from prompt inputs.
      operationId: dataPlaneEmbeddings
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIEmbeddingRequest'
      responses:
        '200':
          description: Embeddings array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIEmbeddingResponse'

  /v1/models:
    servers:
      - url: http://localhost:8080
        description: Data Plane Proxy
    get:
      tags:
        - Data Plane - Models
      summary: List Models & Virtual Aliases
      description: Lists all available physical provider models and virtual model aliases.
      operationId: dataPlaneListModels
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Models list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderModel'

  /v1/models/{id}:
    servers:
      - url: http://localhost:8080
        description: Data Plane Proxy
    get:
      tags:
        - Data Plane - Models
      summary: Retrieve Model
      description: Retrieves a model or alias by identifier.
      operationId: dataPlaneGetModel
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModel'
        '404':
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'

  # ============================================================================
  # CONTROL PLANE ENDPOINTS (:8081)
  # ============================================================================
  /admin/auth/login:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    post:
      tags:
        - Control Plane - Auth & Profile
      summary: Admin Session Login
      operationId: cpAdminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Session token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /admin/auth/me:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Auth & Profile
      summary: Current Profile
      operationId: cpGetCurrentUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: User object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /admin/auth/password:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    post:
      tags:
        - Control Plane - Auth & Profile
      summary: Change Password
      operationId: cpChangePassword
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password updated.

  /admin/tenants:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Tenants & Billing
      summary: List Tenant Partitions
      operationId: cpListTenants
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: List of tenants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
    post:
      tags:
        - Control Plane - Tenants & Billing
      summary: Create Tenant Partition
      operationId: cpCreateTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [internal, external]
                  default: external
                billing_mode:
                  type: string
                  enum: [prepaid, postpaid]
                  default: prepaid
                budget_limit_monthly:
                  type: number
                  format: float
                allowed_models:
                  type: array
                  items:
                    type: string
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

  /admin/tenants/{id}:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Tenants & Billing
      summary: Get Tenant
      operationId: cpGetTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    patch:
      tags:
        - Control Plane - Tenants & Billing
      summary: Update Tenant
      operationId: cpUpdateTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPatch'
      responses:
        '200':
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    delete:
      tags:
        - Control Plane - Tenants & Billing
      summary: Delete Tenant Partition
      operationId: cpDeleteTenant
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted.

  /admin/tenants/{id}/topup:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    post:
      tags:
        - Control Plane - Tenants & Billing
      summary: Top Up Tenant Credit Balance
      operationId: cpTopUpTenantCredit
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpCreditRequest'
      responses:
        '200':
          description: Balance updated transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreditTransaction'

  /admin/tenants/{id}/transactions:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Tenants & Billing
      summary: List Tenant Transactions
      operationId: cpListTenantTransactions
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transactions.

  /admin/users:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Users & API Keys
      summary: List Users
      operationId: cpListUsers
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Control Plane - Users & API Keys
      summary: Create User
      operationId: cpCreateUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
                password:
                  type: string
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags:
        - Control Plane - Users & API Keys
      summary: Update User
      operationId: cpUpdateUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                role:
                  type: string
                is_active:
                  type: boolean
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: User updated.
    delete:
      tags:
        - Control Plane - Users & API Keys
      summary: Delete User
      operationId: cpDeleteUser
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted.

  /admin/keys:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Users & API Keys
      summary: List API Keys
      operationId: cpListAPIKeys
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
    post:
      tags:
        - Control Plane - Users & API Keys
      summary: Provision API Key
      operationId: cpCreateAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - name
              properties:
                user_id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                  format: uuid
                name:
                  type: string
                budget_limit:
                  type: number
                rate_limit_rpm:
                  type: integer
                cache_ttl_seconds:
                  type: integer
                budget_period:
                  type: string
      responses:
        '201':
          description: Key created. Plaintext returned once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    $ref: '#/components/schemas/APIKey'
                  key:
                    type: string
    patch:
      tags:
        - Control Plane - Users & API Keys
      summary: Update API Key
      operationId: cpUpdateAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                budget_limit:
                  type: number
                rate_limit_rpm:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Key updated.
    delete:
      tags:
        - Control Plane - Users & API Keys
      summary: Revoke API Key
      operationId: cpRevokeAPIKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key revoked.

  /admin/keys/reactivate:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    post:
      tags:
        - Control Plane - Users & API Keys
      summary: Reactivate Key
      operationId: cpReactivateKey
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Key reactivated.

  /admin/keys/{id}/models:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Users & API Keys
      summary: List Key Model Policies
      operationId: cpListKeyModelPolicies
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Model policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyModelPolicy'
    post:
      tags:
        - Control Plane - Users & API Keys
      summary: Add Key Model Policy Rule
      operationId: cpCreateKeyModelPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model_pattern
                - action
              properties:
                model_pattern:
                  type: string
                action:
                  type: string
                  enum: [allow, deny]
      responses:
        '201':
          description: Rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyModelPolicy'

  /admin/keys/{id}/models/{pid}:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    delete:
      tags:
        - Control Plane - Users & API Keys
      summary: Delete Key Model Policy Rule
      operationId: cpDeleteKeyModelPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule deleted.

  /admin/groups:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Groups & IAM
      summary: List IAM Groups
      operationId: cpListGroups
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags:
        - Control Plane - Groups & IAM
      summary: Create IAM Group
      operationId: cpCreateGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                budget_limit_monthly:
                  type: number
                rate_limit_rpm:
                  type: integer
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /admin/groups/{id}:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Groups & IAM
      summary: Get Group
      operationId: cpGetGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      tags:
        - Control Plane - Groups & IAM
      summary: Update Group
      operationId: cpUpdateGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                budget_limit_monthly:
                  type: number
                rate_limit_rpm:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Group updated.
    delete:
      tags:
        - Control Plane - Groups & IAM
      summary: Delete Group
      operationId: cpDeleteGroup
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group deleted.

  /admin/groups/{id}/policies:
    servers:
      - url: http://localhost:8081
        description: Control Plane Admin
    get:
      tags:
        - Control Plane - Groups & IAM
      summary: List Group IAM Policies
      operationId: cpListGroupPolicies
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupPolicy'
    post:
      tags:
        - Control Plane - Groups & IAM
      summary: Attach IAM Policy to Group
      operationId: cpCreateGroupPolicy
      security:
        - AdminApiKeyAuth: []
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - policy
              properties:
                name:
                  type: string
                policy:
