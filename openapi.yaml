components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
      description: "Data Plane API key (`Authorization: Bearer sk-gw-...`)."
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: "Data Plane API key header (`x-api-key: sk-gw-...`)."
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: Root Break-Glass Administration API Key.
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin session token from `/admin/auth/login`.

  schemas:
    OpenAIChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          example: fast-chat
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIChatMessage'
        stream:
          type: boolean
          default: false

    OpenAIChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool, function]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object

    OpenAIChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object

    AnthropicMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
        max_tokens:
          type: integer
        stream:
          type: boolean

    AnthropicMessageResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        content:
          type: array
          items:
            type: object

    OpenAIEmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    OpenAIEmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object

    ProviderModel:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: model
        created:
          type: integer
        owned_by:
          type: string

    OpenAIErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string

    AnthropicErrorResponse:
      type: object
      properties:
        type:
          type: string
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
