[project]
name = "llmgw-cli"
version = "0.3.1"
description = "CLI tool to manage LLM Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
llmgw = "llmgw.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]
