[project]
name = "llmgw-cli"
version = "0.3.1"
description = "CLI tool to manage LLM Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "mcp>=1.2.0",
    "fastmcp>=0.4.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
llmgw = "llmgw.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmgw"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pyinstaller>=6.22.2",
    "ruff>=0.16.6",
]
