services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_gateway
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - PORT=8080
      - ADMIN_PORT=8081
      - DB_HOST=postgres

      - DB_PORT=5432
      - DB_USER=llm_user
      - DB_PASSWORD=llm_password
      - DB_NAME=llm_gateway
      - DB_SSLMODE=disable
      - REDIS_HOST=redis:6379
      - ADMIN_API_KEY=${ADMIN_API_KEY:-sk-admin-secret-key-change-me}
      - PROVIDER_MASTER_KEY=${PROVIDER_MASTER_KEY:-}
      - CACHE_RESPONSE_TTL_SECONDS=${CACHE_RESPONSE_TTL_SECONDS:-3600}
      - OTEL_EXPORTER=${OTEL_EXPORTER:-none}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-none}
      - SLO_MAX_TTFT_MS=${SLO_MAX_TTFT_MS:-500}
      - SLO_MAX_TBT_MS=${SLO_MAX_TBT_MS:-250}
      - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: llm_postgres
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_password
      POSTGRES_DB: llm_gateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm_redis
    #ports:
    #  - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: llm_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    profiles: ["monitoring", "all"]

  grafana:
    image: grafana/grafana:latest
    container_name: llm_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["monitoring", "all"]

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
