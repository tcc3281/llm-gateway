name: "🐛 Bug Report"
description: "Report a reproducible bug or issue with LLM Gateway"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: "LLM Gateway Version"
      description: "Which version of LLM Gateway are you running? (e.g. v0.2.1, git commit hash)"
      placeholder: "e.g. v0.2.1"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: "Deployment Mode"
      options:
        - "Docker Compose (All-in-One)"
        - "Docker Compose (Distributed Cluster)"
        - "Standalone Binary"
        - "Kubernetes"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Provide steps or a curl command to reproduce the behavior."
      placeholder: |
        1. Start gateway with `docker compose up -d`
        2. Send request: `curl ...`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs or Error Output"
      description: "Please copy and paste any relevant logs from Docker or console (redact any sensitive keys!)."
      render: shell
