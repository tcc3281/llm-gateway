name: Release CLI Apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: llmgw-linux-amd64
            asset_name: llmgw-linux-amd64
          - os: macos-latest
            artifact_name: llmgw-darwin-amd64
            asset_name: llmgw-darwin-amd64
          - os: windows-latest
            artifact_name: llmgw-windows-amd64.exe
            asset_name: llmgw-windows-amd64.exe

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Build Standalone Binary with PyInstaller
        run: |
          uv run pyinstaller --name llmgw --onefile src/llmgw/main.py

      - name: Rename Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv dist/llmgw dist/${{ matrix.asset_name }}

      - name: Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: move dist\llmgw.exe dist\${{ matrix.asset_name }}

      - name: Package Skill Folder
        if: matrix.os == 'ubuntu-latest'
        run: zip -r dist/llmgw-agent-skill.zip ../skills/llmgw-cli/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: cli/dist/${{ matrix.asset_name }}

      - name: Upload Skill Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: llmgw-agent-skill.zip
          path: cli/dist/llmgw-agent-skill.zip

      - name: Upload Binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: cli/dist/${{ matrix.asset_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Skill to Release
        if: github.event_name == 'release' && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: cli/dist/llmgw-agent-skill.zip
          token: ${{ secrets.GITHUB_TOKEN }}
