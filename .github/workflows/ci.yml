name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: Verify go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is dirty, please run 'go mod tidy'" && exit 1)

      - name: Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests with Race Detector & Coverage
        run: go test -v -race -timeout 10m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Test Build Gateway Binary
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/gateway

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Vite Build
        run: npm run build

  cli-lint:
    name: CLI Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync CLI dependencies
        run: uv sync --project cli

      - name: Validate CLI entrypoint
        run: uv run --project cli llmgw --help

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build & Compose Check
    needs: [backend-test, frontend-build, cli-lint, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose --profile all config

      - name: Build Docker Image with Buildx Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
