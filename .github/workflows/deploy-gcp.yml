name: GCP Cloud Run Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push Image & Deploy via Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Write GCP SA Key for Terraform
        working-directory: terraform
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gdgdevfest2026-515408-6b41e29434d7.json

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Enable GCP APIs & Provision Infrastructure Base
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=google_project_service.enabled_apis \
            -target=google_artifact_registry_repository.app_repo

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Set up Node.js for Web Build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            asia-east1-docker.pkg.dev/gdgdevfest2026-515408/llm-gateway-repo/llm-gateway:latest
            asia-east1-docker.pkg.dev/gdgdevfest2026-515408/llm-gateway-repo/llm-gateway:${{ github.sha }}

      - name: Complete Terraform Apply (Cloud Run & Services)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="container_image=asia-east1-docker.pkg.dev/gdgdevfest2026-515408/llm-gateway-repo/llm-gateway:${{ github.sha }}"
