name: GCP Cloud Run Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, Push Image & Deploy via Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable GCP APIs Automatically
        run: |
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            sqladmin.googleapis.com \
            redis.googleapis.com \
            secretmanager.googleapis.com \
            vpcaccess.googleapis.com \
            servicenetworking.googleapis.com \
            compute.googleapis.com \
            storage.googleapis.com \
            --project=gdgdevfest2026-515408

      - name: Ensure GCS Bucket for Terraform State Exists
        run: |
          gcloud storage buckets describe gs://gdgdevfest2026-515408-tfstate --project=gdgdevfest2026-515408 || \
          gcloud storage buckets create gs://gdgdevfest2026-515408-tfstate \
            --location=asia-east1 \
            --project=gdgdevfest2026-515408 \
            --uniform-bucket-level-access

      - name: Grant Secret Accessor to Cloud Run Service Account
        run: |
          gcloud projects add-iam-policy-binding gdgdevfest2026-515408 \
            --member="serviceAccount:865525096722-compute@developer.gserviceaccount.com" \
            --role="roles/secretmanager.secretAccessor" \
            --condition=None || true

      - name: Ensure Artifact Registry Repository Exists
        run: |
          gcloud artifacts repositories describe llm-gateway-repo --location=asia-east1 --project=gdgdevfest2026-515408 || \
          gcloud artifacts repositories create llm-gateway-repo \
            --repository-format=docker \
            --location=asia-east1 \
            --description="Docker container repository for LLM Gateway" \
            --project=gdgdevfest2026-515408

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Set up Node.js for Web Build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            asia-east1-docker.pkg.dev/gdgdevfest2026-515408/llm-gateway-repo/llm-gateway:latest
            asia-east1-docker.pkg.dev/gdgdevfest2026-515408/llm-gateway-repo/llm-gateway:${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Write GCP SA Key for Terraform
        working-directory: terraform
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gdgdevfest2026-515408-6b41e29434d7.json

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Terraform Apply Infrastructure & Cloud Run
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="container_image=asia-east1-docker.pkg.dev/gdgdevfest2026-515408/llm-gateway-repo/llm-gateway:${{ github.sha }}"
